services:
  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_PORT: "15432"
      DB_NAME: demo
      DB_USER: demo
      DB_PASSWORD: demo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 20
